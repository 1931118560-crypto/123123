workflows:
  ios_app_store:
    name: MindPlan iOS App Store
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.mindplan.app"
        XCODE_WORKSPACE: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      groups:
        - app_store_credentials
    scripts:
      - name: Install JS dependencies
        script: |
          npm install
      - name: Build web assets and sync iOS
        script: |
          npm run build
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          # Set code signing style to manual
          plutil -replace "CODE_SIGN_STYLE" -string "Manual" ios/App/App.xcodeproj/project.pbxproj || true
          plutil -replace "DEVELOPMENT_TEAM" -string "9H86QFCQ8T" ios/App/App.xcodeproj/project.pbxproj || true
      - name: Build IPA
        script: |
          xcodebuild -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/xcarchive/App.xcarchive \
            clean archive
          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/exportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
